            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK 888 - Casino & Gaming</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        /* Main Container */
        .auth-container { width: 100%; max-width: 400px; background: #262626; border-radius: 12px; padding: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-area h1 { color: #f9b134; font-size: 32px; font-weight: 800; letter-spacing: 2px; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { color: #f9b134; border-bottom: 3px solid #f9b134; }
        
        /* Form Elements */
        .input-group { margin-bottom: 15px; position: relative; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #444; }
        .input-group input { width: 100%; background: transparent; border: none; color: #fff; outline: none; padding: 5px; }
        .input-group span { color: #aaa; font-size: 12px; }
        
        /* Password Strength */
        .strength-bar { height: 4px; background: #444; margin-top: 10px; display: flex; gap: 4px; }
        .bar { flex: 1; background: #333; }
        
        /* Checkbox */
        .terms { font-size: 11px; color: #888; margin: 15px 0; display: flex; align-items: center; gap: 8px; }
        
        /* Button */
        .btn-register { width: 100%; background: #f9b134; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; font-size: 16px; margin-top: 10px; }
        
        /* Bottom Links */
        .social-login { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
        .social-login i { font-size: 24px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>MK 888</h1>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchForm('register')">Register</div>
            <div class="tab" onclick="switchForm('login')">Login</div>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <!-- Register Form Part -->
            <div id="register-fields">
                <div class="input-group">
                    <span>+92</span>
                    <input type="tel" id="phone" placeholder="*Please enter Phone number" required>
                </div>
                <div class="input-group">
                    <input type="password" id="pass" placeholder="*Enter password" required>
                </div>
                <div class="strength-bar">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <div class="input-group" style="margin-top:15px;">
                    <input type="password" id="repass" placeholder="*Enter password again" required>
                </div>
                <div class="terms">
                    <input type="checkbox" checked> I am over 18 years old and have read and agreed to User Agreement
                </div>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Register</button>
        </form>

        <div class="social-login">
            <i class="fab fa-google" style="color: #db4437;"></i>
            <i class="fab fa-facebook" style="color: #4267B2;"></i>
            <i class="fab fa-telegram" style="color: #0088cc;"></i>
        </div>
    </div>

    <script>
        let isLogin = false;

        function switchForm(type) {
            isLogin = (type === 'login');
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active'));
            document.getElementById('submitBtn').innerText = isLogin ? 'Login' : 'Register';
            
            if(isLogin) {
                document.getElementById('register-fields').style.display = 'none';
            } else {
                document.getElementById('register-fields').style.display = 'block';
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            alert(isLogin ? "Login process initialized!" : "Registration successful! Welcome to MK 888.");
        }
    </script>
</body>
</html>
