<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK 888 - Official</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #1a1a1a; color: #fff; padding-bottom: 70px; }
        .hidden { display: none; }
        
        /* Top Header */
        header { background: #262626; padding: 15px; text-align: center; font-weight: bold; color: #f9b134; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #262626; padding: 10px; border-top: 1px solid #333; }
        .nav-item { text-align: center; font-size: 12px; color: #aaa; cursor: pointer; }
        .nav-item.active { color: #f9b134; }

        /* Content Sections */
        .content { padding: 15px; }
        .card { background: #262626; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        
        /* Deposit Screen */
        .grid-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .amt-btn { background: #333; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #444; }
        
        /* Game Grid */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .game-item { background: #333; height: 80px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>MK 888</header>

    <!-- Home View -->
    <div id="view-home" class="content">
        <div class="card">Welcome! Balance: <b>Rs 15.41</b></div>
        <h3>Hot Games</h3>
        <div class="game-grid" style="margin-top:10px;">
            <div class="game-item">Slots</div>
            <div class="game-item">Cards</div>
            <div class="game-item">Crash</div>
        </div>
    </div>

    <!-- Deposit View -->
    <div id="view-deposit" class="content hidden">
        <h3>Deposit Amount</h3>
        <div class="grid-amounts">
            <div class="amt-btn">150</div>
            <div class="amt-btn">500</div>
            <div class="amt-btn">1000</div>
            <div class="amt-btn">5000</div>
        </div>
        <button style="width:100%; padding:15px; margin-top:20px; background:#f9b134; border:none; border-radius:5px;">Confirm Deposit</button>
    </div>

    <!-- Profile View -->
    <div id="view-profile" class="content hidden">
        <div class="card">VIP Level: V1 <br> Next Level: 10.00</div>
        <div class="card">My Records</div>
        <div class="card">Security Center</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showView('home')"><i class="fas fa-home"></i><br>Home</div>
        <div class="nav-item" onclick="showView('deposit')"><i class="fas fa-wallet"></i><br>Deposit</div>
        <div class="nav-item" onclick="showView('profile')"><i class="fas fa-user"></i><br>Profile</div>
    </div>

    <script>
        function showView(viewName) {
            document.querySelectorAll('.content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
