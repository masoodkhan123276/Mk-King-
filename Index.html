<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>66x666 - Complete Platform with Admin Controls</title>
    <!-- Icons Link -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111111;
            --card-bg: #171719;
            --accent: #f9b134;
            --accent-glow: rgba(249, 177, 52, 0.2);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --danger: #ff3b30;
            --success: #34c759;
            --input-bg: #1c1c1e;
            --border-color: #2c2c2e;
            --admin-color: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000000; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
        .hidden { display: none !important; }

        /* Mobile Container Layout */
        .app-container { width: 100%; max-width: 480px; background: var(--bg-dark); min-height: 100vh; position: relative; padding-bottom: 75px; border-left: 1px solid #222; border-right: 1px solid #222; display: flex; flex-direction: column; }

        /* TOP LOGO BANNER */
        .brand-header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 1px solid #2a2a2a; position: relative; }
        .brand-logo { font-size: 26px; font-weight: 900; color: var(--accent); font-style: italic; letter-spacing: -1px; }
        .brand-logo span { color: #ffffff; font-size: 28px; }

        /* IN-APP HEADER */
        .app-header { background: var(--card-bg); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--accent); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .balance-box { background: #000; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--accent); font-size: 14px; color: var(--accent); font-weight: bold; }
        .logout-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; }

        /* AUTH FORMS CONTAINER */
        .auth-wrapper { padding: 15px; display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .gift-banner { background: linear-gradient(135deg, #2c1e05, #171719); padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(249,177,52,0.15); margin-bottom: 15px; text-align: center; font-size: 12px; }
        .gift-banner color-gold { color: var(--accent); font-weight: bold; }

        /* TABS */
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #222; }
        .auth-tab { flex: 1; text-align: center; padding: 15px 0; cursor: pointer; color: var(--text-sub); font-weight: bold; font-size: 16px; }
        .auth-tab.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

        .auth-card { background: var(--card-bg); padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .reg-sub-tabs { display: flex; gap: 15px; margin-bottom: 20px; font-size: 13px; color: var(--text-sub); }
        .reg-sub-tab { cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .reg-sub-tab.active { color: var(--accent); font-weight: bold; }

        /* INPUT FIELDS */
        .input-label { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; display: block; }
        .input-group { background: var(--input-bg); padding: 14px 15px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; position: relative; }
        .country-flag { display: flex; align-items: center; gap: 6px; padding-right: 12px; border-right: 1px solid #3a3a3c; font-size: 14px; font-weight: bold; color: #fff; }
        .input-group i { color: #555; font-size: 16px; }
        .input-group input { background: none; border: none; color: #fff; width: 100%; outline: none; font-size: 14px; }
        .toggle-pass { position: absolute; right: 15px; cursor: pointer; color: #555 !important; }

        /* CHECKBOX */
        .checkbox-container { display: flex; align-items: flex-start; gap: 8px; margin: 15px 0; font-size: 12px; color: var(--text-sub); line-height: 1.4; }
        .checkbox-container input { margin-top: 2px; accent-color: var(--accent); width: 15px; height: 15px; }

        /* BUTTONS */
        .btn-yellow { width: 100%; padding: 15px; background: linear-gradient(180deg, #fbc02d 0%, #f9a825 100%); border: none; border-radius: 8px; font-weight: bold; color: #000; cursor: pointer; font-size: 16px; margin-top: 5px; text-transform: uppercase; }
        .btn-admin { background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%) !important; color: white !important; padding: 10px 15px; font-size: 12px; border-radius: 6px; margin-top: 5px; }
        .btn-danger { background: #ff3b30 !important; color: white !important; }
        .btn-success { background: #34c759 !important; color: black !important; }

        /* SOCIAL BINDING */
        .social-binding { margin-top: 30px; text-align: center; }
        .social-icons { display: flex; justify-content: center; gap: 25px; }
        .social-icons a { width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 22px; text-decoration: none; }
        .social-icons a.google { background: #fff; color: #000; }
        .social-icons a.facebook { background: #1877f2; }
        .social-icons a.telegram { background: #0088cc; }

        /* LOBBY */
        .view-section { padding: 20px 15px; flex: 1; }
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .game-card { background: var(--card-bg); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid var(--border-color); cursor: pointer; }
        .back-lobby-btn { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }

        /* MOCK SCREENS */
        .mock-screen { height: 180px; background: #050505; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin-bottom: 15px; color: var(--accent); flex-direction: column; gap: 10px; }
        .bet-box { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .bet-box input, .bet-box select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; text-align: center; font-size: 16px; margin-bottom: 10px; font-weight: bold; outline: none; }

        /* SECRET ADMIN PANEL UI */
        .admin-section { background: #151026; border: 1px solid var(--admin-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .admin-title { font-size: 18px; font-weight: bold; color: var(--admin-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .admin-row { margin-bottom: 15px; }
        .admin-row label { font-size: 12px; color: #c084fc; display: block; margin-bottom: 6px; }
        .admin-row input, .admin-row select { width: 100%; padding: 10px; background: #241a3a; border: 1px solid #581c87; color: white; border-radius: 6px; outline: none; }
        
        .request-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .request-table th, .request-table td { border: 1px solid #4a1d96; padding: 8px; text-align: left; }
        .request-table th { background: #2e1065; color: #c084fc; }

        /* WALLET STYLES */
        .pm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .pm-item { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; font-size: 14px; }
        .pm-item.active { border-color: var(--accent); color: var(--accent); background: rgba(249, 177, 52, 0.05); }
        .account-display-box { background: #222; border-radius: 8px; padding: 12px; border: 1px solid #333; margin-bottom: 15px; text-align: left; }
        .account-display-box p { font-size: 13px; color: #aaa; margin-bottom: 4px; }
        .account-display-box strong { color: #fff; font-size: 15px; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card-bg); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { text-align: center; color: var(--text-sub); cursor: pointer; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-admin-btn { color: #c084fc !important; }

        /* TOAST */
        .toast-msg { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 12px 25px; border-radius: 25px; font-size: 13px; font-weight: bold; z-index: 1000; transition: 0.3s ease; }
        .toast-msg.show { top: 20px; }
        .toast-danger { background: var(--danger); color: #fff; }
        .toast-admin { background: var(--admin-color); color: white; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- TOP BRAND BANNER -->
    <div class="brand-header" id="brand-header">
